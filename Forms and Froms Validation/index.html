<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Forms and Form Validation</h1>
    <form id="myForm">
        <input required minlength="3" maxlength="10" id="name" type="text"  placeholder="name">
        
        <div id="hide">
            <br>
            <small>Your name should be greater than 2 characters</small>
        </div>
        <br><br>
        <input  type="email" placeholder="email">
        <br><br>
        <input  required ="password" placeholder="password">
        <br><br>
        <select>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>
        <textarea placeholder="Tell us about you..."></textarea>
        <br><br>
        <input type="submit">
        <br><br>
    </form>
    <script src="script.js"></script>
</body>
</html>
